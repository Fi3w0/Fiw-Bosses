name: release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17 + 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Setup Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Read mod version
        id: version
        run: |
          VERSION="$(awk -F= '$1 == "mod_version" { print $2 }' gradle.properties)"
          if [ -z "$VERSION" ]; then
            echo "mod_version not found in gradle.properties" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build all targets
        run: ./gradlew build --stacktrace
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}

      - name: Collect loader jars
        run: |
          mkdir -p release
          # production jars only: drop sources/dev jars and the internal core library
          find . -path '*/build/libs/*.jar' \
            ! -name '*-sources.jar' ! -name '*-dev.jar' ! -name '*-shadow.jar' \
            ! -name 'fiw-bosses-core-*.jar' -exec cp -v {} release/ \;
          test "$(find release -name '*.jar' | wc -l)" -eq 8
          ls -la release

      - name: Extract changelog section for this tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # print the "## [VERSION] ..." section up to the next "## [" heading
          awk -v ver="$VERSION" '
            /^## \[/ { if (p) exit; if ($0 ~ ("^## \\[" ver "\\]")) p=1 }
            p { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "FIW Bosses $VERSION" > RELEASE_NOTES.md
          fi

      - name: Ensure release tag
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git tag --list "$TAG" | grep -qx "$TAG"; then
            echo "$TAG already exists"
          else
            git config user.name "Fi3w0"
            git config user.email "fi3w0@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/*.jar --clobber
          else
            gh release create "$TAG" release/*.jar \
              --title "FIW Bosses $VERSION" \
              --notes-file RELEASE_NOTES.md \
              --verify-tag \
              --latest
          fi

      - name: Publish Modrinth release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: bash .github/scripts/publish-modrinth.sh
