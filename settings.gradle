pluginManagement {
    repositories {
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
        maven { name = 'NeoForged'; url = 'https://maven.neoforged.net/releases' }
        maven { name = 'MinecraftForge'; url = 'https://maven.minecraftforge.net/' }
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    // Auto-provisions the JDK toolchains modules request (Java 17 for 1.20.1,
    // Java 21 for 1.21.x) so the build works regardless of which JDK launched Gradle.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'fiw-bosses'

// MC-free shared engine.
include 'core'

// Loader modules. Each MC version's shared 'common-<v>' source is compiled into
// its loader modules via srcDir (see each loader build.gradle), so common-<v> is
// not itself a Gradle subproject.
include 'fabric-1.21.11'
include 'neoforge-1.21.11'
include 'fabric-1.21.1'
include 'neoforge-1.21.1'
include 'fabric-1.21.8'
include 'neoforge-1.21.8'
include 'fabric-1.20.1'
include 'forge-1.20.1'
