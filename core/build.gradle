plugins {
    id 'java-library'
}

base {
    archivesName = "${project.archives_base_name}-core"
}

repositories {
    mavenCentral()
}

java {
    // Java 17 = lowest common denominator (1.20.1 = 17, 1.21.x = 21).
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    // Gson + SLF4J are provided by Minecraft at runtime, so they are compile-only
    // here and only pulled in for tests. They must NOT be shaded into loader jars.
    compileOnly 'com.google.code.gson:gson:2.10.1'
    compileOnly 'org.slf4j:slf4j-api:2.0.9'

    testImplementation 'com.google.code.gson:gson:2.10.1'
    testImplementation 'org.slf4j:slf4j-api:2.0.9'
    testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.9'
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}
